[project]
name = "novel-writer"
version = "0.0.2"
description = "马良 - 小说/剧本写作桌面工具（标准库 HTTP + pywebview + SQLite）"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.0",
    "pywebview>=6.2.1",
]

[project.scripts]
novel-writer = "app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
